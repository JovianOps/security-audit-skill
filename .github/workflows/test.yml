name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validators:
    name: Validators (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows takes the validators' lstat/fstat identity path; the others
        # take O_NOFOLLOW | O_NONBLOCK.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # Zero-dependency validators: nothing to install.
      # Quoted so Node expands the glob itself, identically on every runner shell.
      - run: node --test "skills/security-audit/*.test.cjs"
