name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validators:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run validate-findings tests
        run: node validate-findings.test.cjs
        working-directory: skills/security-audit
      - name: Run validate-coverage-ledger tests
        run: node validate-coverage-ledger.test.cjs
        working-directory: skills/security-audit
